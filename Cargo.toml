[package]
name = "color-evolution-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "0.19"
winit = "0.29"
bytemuck = { version = "1.14", features = ["derive"] }
nalgebra = "0.33"
rand = "0.8"
rand_chacha = "0.3"
parking_lot = "0.12"
crossbeam = "0.8"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"

[[bin]]
name = "color-evolution-sim"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
